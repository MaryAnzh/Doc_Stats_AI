<div class="auth_form">
  <h2 appTypography variant="bodyMMedium">Login</h2>

  <app-input
    label="Email"
    placeholder="Enter email"
    [value]="email()"
    (valueChange)="email.set($event)"
  ></app-input>

  <app-input
    label="Password"
    placeholder="Enter password"
    type="password"
    [value]="password()"
    (valueChange)="password.set($event)"
  ></app-input>

  @if (error()) {
    <div class="auth_error" appTypography="bodySRegular">
      {{ error() }}
    </div>
  }
  <div class="auth_btn_wrap">
    <app-button
      text="Login"
      size="md"
      [disabled]="loading()"
      color="accent"
      (click)="submit()"
    ></app-button>
    <app-button
      text="Go to Register"
      size="md"
      [disabled]="loading()"
      color="ghost"
      navTo="auth/register"
    ></app-button>
  </div>
</div>
