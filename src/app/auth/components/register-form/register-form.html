<div class="auth_form">
  <h2 appTypography="headingLMedium">Register</h2>

  <app-input
    label="Name"
    placeholder="Your name"
    [value]="name()"
    (valueChange)="name.set($event)"
  ></app-input>

  <app-input
    label="Email"
    placeholder="Enter email"
    [value]="email()"
    (valueChange)="email.set($event)"
  ></app-input>

  <app-input
    label="Password"
    placeholder="Enter password"
    type="password"
    [value]="password()"
    (valueChange)="password.set($event)"
  ></app-input>

  @if (error()) {
    <div class="auth_error" appTypography="bodySRegular">
      {{ error() }}
    </div>
  }
  <div class="auth_btn_wrap">
    <app-button
      text="Register"
      size="md"
      [disabled]="loading()"
      color="accent"
      (click)="submit()"
    ></app-button>
    <app-button text="Go to Login" size="md" color="ghost" navTo="auth/login"></app-button>
  </div>
</div>
